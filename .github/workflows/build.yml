name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Create Buildozer Spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Anmol Cashier
          package.name = anmolcashier
          package.domain = org.anmol

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,ttf,wav,mp3

          version = 1.0

          requirements = python3,pygame

          orientation = landscape
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 0

          [android]
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.skip_update = False
          EOF

      - name: Build APK with Docker
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v ${{ github.workspace }}:/home/user/hostpython \
            -w /home/user/hostpython \
            kivy/buildozer:latest \
            -c "yes | buildozer -v android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnmolCashier-APK
          path: bin/*.apk
