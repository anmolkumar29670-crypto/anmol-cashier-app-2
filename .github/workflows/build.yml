name: Build Android APK (Super Fast)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Buildozer Spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Anmol Cashier
          package.name = anmolcashier
          package.domain = org.anmol

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,ttf,wav,mp3
          version = 1.0

          requirements = python3,hostpython3,pygame

          orientation = landscape
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 1

          [android]
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.skip_update = False
          EOF

      - name: Build APK (Fast Container)
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnmolCashier-APK
          path: bin/*.apk
