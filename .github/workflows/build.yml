name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev build-essential ccache clang lld
        pip install --upgrade pip
        pip install "cython==0.29.33" buildozer==1.5.0

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Generate buildozer.spec (Using System Android SDK)
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Anmol Cashier
        package.name = anmolcashier
        package.domain = org.anmol
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,wav,mp3
        version = 1.0
        requirements = python3,pygame
        orientation = portrait
        fullscreen = 0

        [buildozer]
        log_level = 2
        warn_on_root = 1

        [android]
        android.sdk_path = /usr/local/lib/android/sdk
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.ndk_api = 21
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        android.skip_update = False
        EOF

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnmolCashier-APK
        path: bin/*.apk
