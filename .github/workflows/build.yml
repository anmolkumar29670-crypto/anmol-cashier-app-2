name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev git zip unzip openjdk-11-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf libtool pkg-config
          python -m pip install --upgrade pip
          pip install "cython<3.0.0" buildozer==1.5.0

      - name: Generate buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Anmol Cashier
          package.name = anmolcashier
          package.domain = org.anmol
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,wav,mp3
          version = 1.0
          requirements = python3,pygame
          orientation = portrait
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 1

          [android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.ndk_api = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.skip_update = False
          EOF

      - name: Build APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnmolCashier-APK
          path: bin/*.apk
