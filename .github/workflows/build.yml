name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Create Buildozer Spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Anmol Cashier
          package.name = anmolcashier
          package.domain = org.anmol

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,ttf,wav,mp3

          version = 1.0

          requirements = python3,pygame

          orientation = landscape
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 0

          [android]
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          EOF

      - name: Check Android SDK
        run: |
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          find "$ANDROIDSDK" -type f -name aidl -print 2>/dev/null || true

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnmolCashier-APK
          path: bin/*.apk
          
