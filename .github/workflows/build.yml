name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies & Pin Cython
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Create Buildozer Spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Anmol Cashier
          package.name = anmolcashier
          package.domain = org.anmol

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,ttf,wav,mp3
          version = 1.0

          requirements = python3,pygame

          orientation = landscape
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 1

          [android]
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.skip_update = False
          EOF

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnmolCashier-APK
          path: bin/*.apk
