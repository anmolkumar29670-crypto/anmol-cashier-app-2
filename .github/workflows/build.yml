name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev build-essential ccache clang lld
        pip install --upgrade pip
        pip install "cython==0.29.33" buildozer==1.5.0

    - name: Complete System SDK & sdkmanager Setup
      run: |
        # Reset previous cache
        rm -rf ~/.buildozer
        mkdir -p ~/.buildozer/android/platform/android-sdk

        # Link all system SDK folders
        ln -s /usr/local/lib/android/sdk/build-tools ~/.buildozer/android/platform/android-sdk/
        ln -s /usr/local/lib/android/sdk/cmdline-tools ~/.buildozer/android/platform/android-sdk/
        ln -s /usr/local/lib/android/sdk/platforms ~/.buildozer/android/platform/android-sdk/
        ln -s /usr/local/lib/android/sdk/platform-tools ~/.buildozer/android/platform/android-sdk/
        ln -s /usr/local/lib/android/sdk/licenses ~/.buildozer/android/platform/android-sdk/

        # Fix legacy 'tools/bin/sdkmanager' path expected by Buildozer
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools
        ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin ~/.buildozer/android/platform/android-sdk/tools/bin

        # Auto-accept all SDK licenses
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Generate buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Anmol Cashier
        package.name = anmolcashier
        package.domain = org.anmol
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,wav,mp3
        version = 1.0
        requirements = python3,pygame
        orientation = portrait
        fullscreen = 0

        [buildozer]
        log_level = 2
        warn_on_root = 1

        [android]
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.ndk_api = 21
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        android.skip_update = False
        EOF

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnmolCashier-APK
        path: bin/*.apk
